name: Release Version
'on':
  workflow_call:
    inputs:
      project-name:
        required: true
        type: string
      file-name:
        required: true
        type: string
    secrets:
      OSS_KEY_ID:
        required: true
      OSS_KEY_SECRET:
        required: true
      GoogleID:
        required: false
      GoogleSecret:
        required: false
      DropboxKey:
        required: false
      DropboxSecret:
        required: false
      OneDriveID:
        required: false
      OneDriveSecret:
        required: false
      OneDrivePublic:
        required: false
      API_TOKEN_GITHUB:
        required: true
jobs:
  goreleaser:
    runs-on: ubuntu-22.04
    env:
      GOPRIVATE: github.com/IceWhaleTech
    steps:
    - name: Install dependencies for cross-compiling
      run: "sudo apt update || true \nsudo apt-get --no-install-recommends --yes install\
        \ \\\n  upx libc6-dev-amd64-cross \\\n  gcc-aarch64-linux-gnu libc6-dev-arm64-cross\
        \ \\\n  gcc-arm-linux-gnueabihf libc6-dev-armhf-cross \\\n  gcc-riscv64-linux-gnu\
        \ libc6-dev-riscv64-cross\n"
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: v1.8.1-alpha2
        persist-credentials: ${{ matrix.persist }}
    - name: Add Github Key
      run: 'export GO111MODULE=on

        git config --global url."https://${{ secrets.API_TOKEN_GITHUB }}@github.com".insteadOf
        "https://github.com"

        '
      if: matrix.mode == 'existing-expression'
    - name: Configure token through environment
      if: matrix.mode == 'token-environment'
      env:
        API_TOKEN_GITHUB: ${{ secrets.API_TOKEN_GITHUB }}
      run: 'git config --global url."https://${API_TOKEN_GITHUB}@github.com".insteadOf
        "https://github.com"

        '
    - name: Configure explicit token authentication
      if: matrix.mode == 'explicit-token-authentication'
      env:
        API_TOKEN_GITHUB: ${{ secrets.API_TOKEN_GITHUB }}
      run: 'git config --global url."https://x-access-token:${API_TOKEN_GITHUB}@github.com/".insteadOf
        "https://github.com/"

        '
    - name: Update submodule
      run: git submodule update --init --recursive
    - name: Fetch all tags
      run: git fetch --force --tags
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        cache-dependency-path: 'go.sum

          '
        cache: false
    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@v4
      with:
        distribution: goreleaser
        version: latest
        args: release --clean --skip=publish,announce --parallelism 2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GoogleID: ${{ secrets.GoogleID }}
        GoogleSecret: ${{ secrets.GoogleSecret }}
        DropboxKey: ${{ secrets.DropboxKey }}
        DropboxSecret: ${{ secrets.DropboxSecret }}
        OneDriveID: ${{ secrets.OneDriveID }}
        OneDriveSecret: ${{ secrets.OneDriveSecret }}
        OneDrivePublic: ${{ secrets.OneDrivePublic }}
        GORELEASER_CURRENT_TAG: v1.8.1-alpha2
    name: ${{ matrix.mode }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - mode: existing-expression
          persist: true
        - mode: token-environment
          persist: true
        - mode: explicit-token-authentication
          persist: false
