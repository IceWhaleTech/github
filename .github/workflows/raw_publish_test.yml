name: RAW publisher checks
on:
  pull_request:
    paths:
      - actions/publish-raw/**
      - tests/test_raw_publish.py
      - .github/workflows/raw_artifact_publish.yml
      - .github/workflows/raw_publish_test.yml
  push:
    branches: [main]
    paths:
      - actions/publish-raw/**
      - tests/test_raw_publish.py
      - .github/workflows/raw_artifact_publish.yml
      - .github/workflows/raw_publish_test.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test publisher without credentials or external services
        run: python3 -m unittest discover -s tests -p 'test_raw_publish.py' -v
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: false
      - name: Validate publisher workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -shellcheck= -pyflakes= .github/workflows/raw_artifact_publish.yml .github/workflows/raw_publish_test.yml
